# cargo-about: the third-party licence notices shipped with the agent binary
# (scripts/third-party-licenses.sh). The accepted list mirrors deny.toml's
# [licenses] allow list, which cargo deny enforces in CI.
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "OpenSSL",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
