name: CI

# Validates pushes to canary/main and all PRs. The release workflow only runs
# on tag push, so without this we'd discover Windows compile failures only
# after tagging — which would leave a half-published GitHub release.

on:
  push:
    branches: [canary, main]
  pull_request:
    branches: [canary, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt-clippy-test:
    name: ${{ matrix.os }} / fmt + clippy + test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: windows
            runner: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ matrix.os }}-cargo-

      - name: cargo fmt --check
        # Run on Linux only; rustfmt output is platform-independent and re-running
        # it on Windows just doubles the wall time.
        if: matrix.os == 'linux'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo build --release
        run: cargo build --release

      - name: Binary size budget
        # Hard ceiling on release binary size. Static-linked musl + ring puts
        # us around 6-8 MiB today; 12 MiB leaves headroom but flags regressions
        # like an accidental tokio/serde_yaml/syn-heavy dep before they ship.
        # Bump deliberately and explain why in the commit if you must.
        if: matrix.os == 'linux'
        run: |
          set -e
          BIN="target/release/connlog-agent"
          BUDGET_BYTES=$((12 * 1024 * 1024))
          SIZE=$(stat -c '%s' "$BIN")
          printf 'binary=%s size=%s bytes (budget=%s bytes / 12 MiB)\n' "$BIN" "$SIZE" "$BUDGET_BYTES"
          if [ "$SIZE" -gt "$BUDGET_BYTES" ]; then
            echo "::error::Release binary exceeds 12 MiB budget ($SIZE bytes). Investigate before bumping the budget."
            exit 1
          fi
