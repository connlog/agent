name: CI

on:
  push:
    branches: [canary, main]
  pull_request:
    branches: [canary, main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  fmt-clippy-test:
    name: linux / fmt + clippy + test
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      - name: cargo build --release
        run: cargo build --release

      - name: Binary size budget
        # Hard ceiling on release binary size. Static-linked musl + ring puts
        # us around 6-8 MiB today; 12 MiB leaves headroom but flags regressions
        # like an accidental tokio/serde_yaml/syn-heavy dep before they ship.
        # Bump deliberately and explain why in the commit if you must.
        run: |
          set -e
          BIN="target/release/connlog-agent"
          BUDGET_BYTES=$((12 * 1024 * 1024))
          SIZE=$(stat -c '%s' "$BIN")
          printf 'binary=%s size=%s bytes (budget=%s bytes / 12 MiB)\n' "$BIN" "$SIZE" "$BUDGET_BYTES"
          if [ "$SIZE" -gt "$BUDGET_BYTES" ]; then
            echo "::error::Release binary exceeds 12 MiB budget ($SIZE bytes). Investigate before bumping the budget."
            exit 1
          fi
