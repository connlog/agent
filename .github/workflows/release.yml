name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: linux
            arch: x86_64
            runner: ubuntu-latest
            ext: ''
            use_cross: true
          - target: aarch64-unknown-linux-musl
            os: linux
            arch: aarch64
            runner: ubuntu-latest
            ext: ''
            use_cross: true
          - target: x86_64-pc-windows-msvc
            os: windows
            arch: x86_64
            runner: windows-latest
            ext: '.exe'
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build release binary (Linux, cross)
        if: matrix.use_cross
        env:
          CONNLOG_SIGNING_PUBLIC_KEY: ${{ secrets.CONNLOG_SIGNING_PUBLIC_KEY }}
          CROSS_CONTAINER_OPTS: "--env CONNLOG_SIGNING_PUBLIC_KEY"
        run: cross build --release --target ${{ matrix.target }}

      - name: Build release binary (Windows, native)
        if: ${{ !matrix.use_cross }}
        shell: pwsh
        env:
          CONNLOG_SIGNING_PUBLIC_KEY: ${{ secrets.CONNLOG_SIGNING_PUBLIC_KEY }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary (Linux)
        if: matrix.os == 'linux'
        run: |
          VERSION="${{ github.ref_name }}"
          OS="${{ matrix.os }}"
          ARCH="${{ matrix.arch }}"
          TARGET="${{ matrix.target }}"

          cd target/$TARGET/release

          TAR="connlog-agent-${VERSION}-${OS}-${ARCH}.tar.gz"
          tar -czf "$TAR" connlog-agent
          sha256sum "$TAR" > "${TAR}.sha256"

          # Raw binary used by the auto-update path.
          cp connlog-agent "connlog-agent-${VERSION}-${OS}-${ARCH}"

      - name: Package binary (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $arch    = "${{ matrix.arch }}"
          $target  = "${{ matrix.target }}"
          $base    = "connlog-agent-$version-windows-$arch"

          Set-Location "target\$target\release"

          # Raw .exe used by the auto-update path. Auto-update verifies via
          # Ed25519 + SHA-256 (Authenticode signing is a separate, optional
          # step — see WINDOWS.md).
          Copy-Item connlog-agent.exe "$base.exe"

          # SHA-256 checksum in sha256sum(1)-compatible format so the agent
          # parser handles Linux + Windows artefacts identically.
          $hash = (Get-FileHash "$base.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  $base.exe`n" | Out-File -Encoding ascii -NoNewline "$base.exe.sha256"

      - name: Upload artifacts (Linux)
        if: matrix.os == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: connlog-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/connlog-agent-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            target/${{ matrix.target }}/release/connlog-agent-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256
            target/${{ matrix.target }}/release/connlog-agent-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}

      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: connlog-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/connlog-agent-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.exe
            target/${{ matrix.target }}/release/connlog-agent-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.exe.sha256

  # ── Sign & Publish ──────────────────────────────────────────
  # This job runs in the protected "release" environment.
  # Configure it in GitHub → Settings → Environments → release:
  #   ✓ Required reviewers (add yourself)
  #   ✓ Restrict to tags matching v*
  # This means no one can publish a release without manual approval,
  # even if they compromise a workflow or push a tag.
  sign-and-release:
    name: Sign & Create Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install signing dependencies
        run: pip install cryptography

      - name: Sign binaries
        env:
          CONNLOG_SIGNING_PRIVATE_KEY: ${{ secrets.CONNLOG_SIGNING_PRIVATE_KEY }}
        run: |
          # Sign each raw binary (not the tarballs — the agent updates with raw binaries)
          for bin in artifacts/*/connlog-agent-${{ github.ref_name }}-*; do
            # Skip tarballs and checksums
            [[ "$bin" == *.tar.gz ]] && continue
            [[ "$bin" == *.sha256 ]] && continue

            echo "Signing $bin ..."
            python3 scripts/sign-release.py "$bin" "$CONNLOG_SIGNING_PRIVATE_KEY"
          done

          echo ""
          echo "=== Release artifacts ==="
          find artifacts -type f | sort

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          NOTES="## ConnLog Agent ${VERSION}

          ### Installation
          \`\`\`bash
          curl -fsSL https://connlog.com/install.sh | sudo sh -s -- --install --token <your-token>
          \`\`\`

          ### Auto-update
          Existing agents will automatically update to this version.
          All binaries are signed with Ed25519 and verified before installation.

          ### Verification
          SHA-256 checksums and Ed25519 signatures (.sig) are attached to every binary."

          if gh release view "$VERSION" &>/dev/null; then
            echo "Release $VERSION already exists, uploading assets..."
            # Upload raw binaries (extensionless files matching the naming pattern)
            for bin in artifacts/*/connlog-agent-${VERSION}-*; do
              [[ "$bin" == *.tar.gz ]] && continue
              [[ "$bin" == *.sha256 ]] && continue
              [[ "$bin" == *.sig ]] && continue
              echo "Uploading raw binary: $bin"
              gh release upload "$VERSION" "$bin" --clobber
            done
            gh release upload "$VERSION" \
              artifacts/**/*.tar.gz \
              artifacts/**/*.sha256 \
              artifacts/**/*.sig \
              --clobber
          else
            # Collect raw binaries into a temp list
            RAW_BINS=()
            for bin in artifacts/*/connlog-agent-${VERSION}-*; do
              [[ "$bin" == *.tar.gz ]] && continue
              [[ "$bin" == *.sha256 ]] && continue
              [[ "$bin" == *.sig ]] && continue
              RAW_BINS+=("$bin")
            done
            gh release create "$VERSION" \
              --title "ConnLog Agent ${VERSION}" \
              --notes "$NOTES" \
              --latest \
              "${RAW_BINS[@]}" \
              artifacts/**/*.tar.gz \
              artifacts/**/*.sha256 \
              artifacts/**/*.sig
          fi
