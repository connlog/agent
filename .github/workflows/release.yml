name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

# Actions are pinned to commit SHAs (the tag is a comment) so a moved tag
# cannot change what builds or signs a release.
#
# The checks gate the build. They run here, in this public repository (no
# Actions minutes are billed for one), and nowhere else: connlog/platform
# runs no CI (owner, 2026-10-30; canary is its check), so this is where the
# signing-key refusal, the size budget, cargo deny and the FreeBSD build
# (OPNsense and pfSense run the agent there) are proved before a release.
jobs:
  checks:
    name: fmt + clippy + test, size budget, signing-key refusal
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUSTFLAGS: '-D warnings'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --all-targets

      - name: Binary size budget
        # Hard ceiling on the release binary: 12 MiB. Built without the
        # signing key, so it never ships.
        env:
          CONNLOG_ALLOW_UNSIGNED_BUILD: '1'
        run: |
          set -e
          cargo build --release
          SIZE=$(stat -c '%s' target/release/connlog-agent)
          BUDGET=$((12 * 1024 * 1024))
          echo "release binary: $SIZE bytes (budget $BUDGET)"
          if [ "$SIZE" -gt "$BUDGET" ]; then
            echo "::error::Release binary exceeds 12 MiB ($SIZE bytes)."
            exit 1
          fi

      - name: Release build refuses to ship without a signing key
        # The guard in build.rs is the only thing between an unset secret
        # and a fleet-wide update that cannot be verified. Prove it trips.
        run: |
          set +e
          out=$(cargo build --release 2>&1)
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::A release build without CONNLOG_SIGNING_PUBLIC_KEY succeeded; build.rs must refuse it."
            exit 1
          fi
          echo "$out" | grep -q "CONNLOG_SIGNING_PUBLIC_KEY" || { echo "::error::Unexpected failure output"; echo "$out"; exit 1; }

  deny:
    name: cargo deny (advisories, licences, sources)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features

  freebsd:
    # A real FreeBSD VM on this Linux runner (there is no FreeBSD runner):
    # clippy and the tests, then the firewall readers against the VM's own
    # kernel with a VLAN interface and a static ARP entry (T13.5b).
    name: FreeBSD 14
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: clippy and test in FreeBSD 14
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: '14.3'
          copyback: false
          prepare: |
            pkg install -y curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal -c clippy
          run: |
            . "$HOME/.cargo/env"
            cargo clippy --all-targets -- -D warnings
            cargo test --all-targets
            parent=$(route -n get default | awk '/interface:/ { print $2 }')
            ifconfig vlan0 create vlan 20 vlandev "$parent" inet 10.99.20.1/24 up
            arp -s 10.99.20.7 02:00:00:00:00:07
            cargo test --all-targets -- --ignored freebsd_

  build:
    name: Build ${{ matrix.target }}
    needs: [checks, deny, freebsd]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: linux
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            os: linux
            arch: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The release signing key must be configured
        # build.rs refuses a release build without the key as well; failing
        # here first gives a readable reason instead of a compiler panic.
        env:
          CONNLOG_SIGNING_PUBLIC_KEY: ${{ secrets.CONNLOG_SIGNING_PUBLIC_KEY }}
        run: |
          key=$(printf '%s' "$CONNLOG_SIGNING_PUBLIC_KEY" | tr -d '[:space:]')
          if [ "${#key}" -ne 64 ] || printf '%s' "$key" | grep -qv '^[0-9a-fA-F]*$'; then
            echo "::error::CONNLOG_SIGNING_PUBLIC_KEY is missing or not 64 hex characters; a release binary without it cannot verify updates."
            exit 1
          fi
          if [ "$key" = "$(printf '0%.0s' $(seq 1 64))" ]; then
            echo "::error::CONNLOG_SIGNING_PUBLIC_KEY is the all-zero placeholder."
            exit 1
          fi
          echo "signing key present (first 8 chars: ${key%"${key#????????}"}...)"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        # Pinned to a specific crates.io release; never git HEAD.
        run: cargo install cross@0.2.5 --locked

      - name: Build release binary
        env:
          CONNLOG_SIGNING_PUBLIC_KEY: ${{ secrets.CONNLOG_SIGNING_PUBLIC_KEY }}
          CROSS_CONTAINER_OPTS: "--env CONNLOG_SIGNING_PUBLIC_KEY"
        run: cross build --release --target ${{ matrix.target }}

      - name: The built binary reports the tagged version
        # The tag must match Cargo.toml (docs/RELEASING.md). A mismatch would
        # send the whole fleet into a download loop; catch it before signing.
        env:
          VERSION: ${{ github.ref_name }}
          TARGET: ${{ matrix.target }}
        run: |
          set -e
          reported=$(target/$TARGET/release/connlog-agent --version 2>/dev/null | awk '{print $NF}' || true)
          if [ "$TARGET" = "aarch64-unknown-linux-musl" ]; then
            echo "skipping --version probe for the cross-built aarch64 binary"
          elif [ "v$reported" != "$VERSION" ]; then
            echo "::error::Binary reports v$reported but the tag is $VERSION"
            exit 1
          else
            echo "binary reports v$reported"
          fi

      - name: Package binary
        # VERSION/OS/ARCH/TARGET are set as env vars to prevent script injection
        # via a crafted tag name containing shell metacharacters.
        env:
          VERSION: ${{ github.ref_name }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          cd target/$TARGET/release

          TAR="connlog-agent-${VERSION}-${OS}-${ARCH}.tar.gz"
          tar -czf "$TAR" connlog-agent
          sha256sum "$TAR" > "${TAR}.sha256"

          # Raw binary used by the auto-update path and the installer.
          cp connlog-agent "connlog-agent-${VERSION}-${OS}-${ARCH}"

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connlog-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/connlog-agent-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            target/${{ matrix.target }}/release/connlog-agent-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256
            target/${{ matrix.target }}/release/connlog-agent-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}

  # The FreeBSD binary and its package (OPNsense, pfSense; T13.5d), built in a
  # FreeBSD VM: the binary links the base system's libc, so it is built where
  # that libc is. With the signing public key, like the Linux builds; signed
  # with them by the next job (the package as a file of its own, so install.sh
  # can verify it before `pkg add`).
  build-freebsd:
    name: Build FreeBSD amd64 and its package
    needs: [checks, deny, freebsd]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and package in FreeBSD 14
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        env:
          CONNLOG_SIGNING_PUBLIC_KEY: ${{ secrets.CONNLOG_SIGNING_PUBLIC_KEY }}
          VERSION: ${{ github.ref_name }}
        with:
          release: '14.3'
          envs: 'CONNLOG_SIGNING_PUBLIC_KEY VERSION'
          prepare: |
            pkg install -y curl
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          run: |
            set -e
            . "$HOME/.cargo/env"
            case "$VERSION" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "bad tag $VERSION"; exit 1 ;; esac
            cargo build --release
            reported=$(target/release/connlog-agent --version | awk '{print $NF}')
            [ "v$reported" = "$VERSION" ] || { echo "binary reports v$reported, tag is $VERSION"; exit 1; }
            mkdir -p dist
            cp target/release/connlog-agent "dist/connlog-agent-${VERSION}-freebsd-x86_64"
            sh packaging/freebsd/build-pkg.sh target/release/connlog-agent "$reported" pkgout
            cp pkgout/connlog-agent-*.pkg "dist/connlog-agent-${VERSION}-freebsd-x86_64.pkg"
            # The package installs and its service starts (no token: it
            # stops at the missing settings, which is the point checked).
            pkg add "dist/connlog-agent-${VERSION}-freebsd-x86_64.pkg"
            pw usershow connlog
            test "$(stat -f %Lp /usr/local/etc/connlog)" = 750
            sysrc -f /etc/rc.conf.d/connlog_agent connlog_agent_enable=YES
            if service connlog_agent start 2>err.log; then
              echo "started without settings"; exit 1
            fi
            grep -q "agent.conf is missing" err.log

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: connlog-agent-freebsd-x86_64
          path: dist/

  # ── Sign & Publish ──────────────────────────────────────────
  # This job runs in the protected "release" environment.
  # Configure it in GitHub → Settings → Environments → release:
  #   ✓ Required reviewers (add yourself)
  #   ✓ Restrict to tags matching v*
  sign-and-release:
    name: Sign & Create Release
    needs: [build, build-freebsd]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Sign binaries
        # OpenSSL only: the job that holds the private key installs nothing
        # from a package index. The script also checks that the private key's
        # public half is the key the binaries were built with.
        env:
          CONNLOG_SIGNING_PRIVATE_KEY: ${{ secrets.CONNLOG_SIGNING_PRIVATE_KEY }}
          CONNLOG_SIGNING_PUBLIC_KEY: ${{ secrets.CONNLOG_SIGNING_PUBLIC_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          # Sign each raw binary (the tarballs carry a checksum for people;
          # the agent and the installer use the raw binaries).
          for bin in artifacts/*/connlog-agent-${VERSION}-*; do
            case "$bin" in
              *.tar.gz | *.sha256 | *.sig) continue ;;
            esac
            echo "Signing $bin ..."
            sh scripts/sign-release.sh "$bin" "$CONNLOG_SIGNING_PRIVATE_KEY"
          done

          echo ""
          echo "=== Release artifacts ==="
          find artifacts -type f | sort

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            artifacts/**/connlog-agent-${{ github.ref_name }}-linux-x86_64
            artifacts/**/connlog-agent-${{ github.ref_name }}-linux-aarch64
            artifacts/**/connlog-agent-${{ github.ref_name }}-freebsd-x86_64
            artifacts/**/connlog-agent-${{ github.ref_name }}-freebsd-x86_64.pkg
            artifacts/**/*.tar.gz

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          NOTES="## ConnLog Agent ${VERSION}

          ### Installation
          \`\`\`bash
          curl -fsSL https://connlog.com/install.sh | sudo CONNLOG_TOKEN=<your-token> sh -s -- --install
          \`\`\`

          ### Supported platforms
          - Linux x86_64 (\`connlog-agent-${VERSION}-linux-x86_64\`)
          - Linux aarch64 (\`connlog-agent-${VERSION}-linux-aarch64\`)
          - FreeBSD amd64, and its package for OPNsense and pfSense (\`connlog-agent-${VERSION}-freebsd-x86_64.pkg\`)
          - Docker, both architectures (\`ghcr.io/connlog/agent:${VERSION#v}\`, published once this release is)

          ### Auto-update
          Existing agents update to this version on their next heartbeat. Every
          binary is signed with the ConnLog Ed25519 release key; the running
          agent verifies the signature, and the root-side apply step verifies
          it again with the key compiled into the installed binary before the
          new binary replaces the old one.

          ### Verification
          Each raw binary ships with a \`.sha256\` checksum and a \`.sig\`
          (Ed25519 over the SHA-256 digest). Tarballs carry a \`.sha256\`.
          Build provenance is attested; verify with \`gh attestation verify\`."

          RAW_BINS=""
          for bin in artifacts/*/connlog-agent-${VERSION}-*; do
            case "$bin" in
              *.tar.gz | *.sha256 | *.sig) continue ;;
            esac
            RAW_BINS="$RAW_BINS $bin"
          done

          # The dependencies' licences require their notices to travel with
          # the binary; the file is regenerated with Cargo.lock (RELEASING.md).
          NOTICES=THIRD-PARTY-LICENSES.md
          test -s "$NOTICES" || { echo "::error::$NOTICES is missing"; exit 1; }

          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists, uploading assets..."
            # shellcheck disable=SC2086
            gh release upload "$VERSION" $RAW_BINS artifacts/*/*.tar.gz artifacts/*/*.sha256 artifacts/*/*.sig "$NOTICES" --clobber
          else
            # shellcheck disable=SC2086
            gh release create "$VERSION" \
              --title "ConnLog Agent ${VERSION}" \
              --notes "$NOTES" \
              --latest \
              $RAW_BINS artifacts/*/*.tar.gz artifacts/*/*.sha256 artifacts/*/*.sig "$NOTICES"
          fi

  # The Docker image (docs/topology/PLAN.md, T13.1): the binaries the job
  # above signed, verified here again with the public key alone, packed into
  # an image with nothing else in it. Runs after the release is published, so
  # an image never exists for a release that does not. No third-party action:
  # the runner's own docker and buildx.
  #
  # The first push creates ghcr.io/connlog/agent as a private package; it is
  # made public once, by hand, in the organisation's package settings.
  image:
    name: Docker image
    needs: sign-and-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts

      - name: Fetch the signatures the release published
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          mkdir -p sigs
          gh release download "$VERSION" --dir sigs --pattern '*.sig'

      - name: Verify and prepare the build context
        env:
          CONNLOG_SIGNING_PUBLIC_KEY: ${{ secrets.CONNLOG_SIGNING_PUBLIC_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          for arch in x86_64 aarch64; do
            bin=$(find artifacts -type f -name "connlog-agent-${VERSION}-linux-${arch}" | head -n 1)
            test -n "$bin" || { echo "::error::no ${arch} binary"; exit 1; }
            cp "sigs/connlog-agent-${VERSION}-linux-${arch}.sig" "$bin.sig"
            sh scripts/verify-release.sh "$bin" "$CONNLOG_SIGNING_PUBLIC_KEY"
            eval "bin_${arch}=\$bin"
          done
          sh docker/context.sh "$RUNNER_TEMP/image" "$bin_x86_64" "$bin_aarch64"

      - name: Build and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -e
          version=${VERSION#v}
          major=${version%%.*}
          image=ghcr.io/connlog/agent
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --name connlog
          # Only COPY instructions: nothing runs for the arm64 image, so no
          # emulation is needed to build it here.
          docker buildx build "$RUNNER_TEMP/image" \
            --platform linux/amd64,linux/arm64 \
            --build-arg "VERSION=$version" \
            --provenance=true --sbom=false \
            --tag "$image:$version" --tag "$image:$major" --tag "$image:latest" \
            --push
