name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: linux
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            os: linux
            arch: aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        # Pinned to a specific crates.io release — avoid fetching arbitrary git HEAD.
        run: cargo install cross@0.2.5 --locked

      - name: Build release binary
        env:
          CONNLOG_SIGNING_PUBLIC_KEY: ${{ secrets.CONNLOG_SIGNING_PUBLIC_KEY }}
          CROSS_CONTAINER_OPTS: "--env CONNLOG_SIGNING_PUBLIC_KEY"
        run: cross build --release --target ${{ matrix.target }}

      - name: Package binary
        # VERSION/OS/ARCH/TARGET are set as env vars to prevent script injection
        # via a crafted tag name containing shell metacharacters.
        env:
          VERSION: ${{ github.ref_name }}
          OS: ${{ matrix.os }}
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
        run: |
          cd target/$TARGET/release

          TAR="connlog-agent-${VERSION}-${OS}-${ARCH}.tar.gz"
          tar -czf "$TAR" connlog-agent
          sha256sum "$TAR" > "${TAR}.sha256"

          # Raw binary used by the auto-update path.
          cp connlog-agent "connlog-agent-${VERSION}-${OS}-${ARCH}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: connlog-agent-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/connlog-agent-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz
            target/${{ matrix.target }}/release/connlog-agent-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}.tar.gz.sha256
            target/${{ matrix.target }}/release/connlog-agent-${{ github.ref_name }}-${{ matrix.os }}-${{ matrix.arch }}

  # ── Sign & Publish ──────────────────────────────────────────
  # This job runs in the protected "release" environment.
  # Configure it in GitHub → Settings → Environments → release:
  #   ✓ Required reviewers (add yourself)
  #   ✓ Restrict to tags matching v*
  sign-and-release:
    name: Sign & Create Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Install signing dependencies
        run: pip install cryptography

      - name: Sign binaries
        env:
          CONNLOG_SIGNING_PRIVATE_KEY: ${{ secrets.CONNLOG_SIGNING_PRIVATE_KEY }}
          VERSION: ${{ github.ref_name }}
        run: |
          # Sign each raw binary (not the tarballs — the agent updates with raw binaries)
          for bin in artifacts/*/connlog-agent-${VERSION}-*; do
            # Skip tarballs and checksums
            [[ "$bin" == *.tar.gz ]] && continue
            [[ "$bin" == *.sha256 ]] && continue

            echo "Signing $bin ..."
            python3 scripts/sign-release.py "$bin" "$CONNLOG_SIGNING_PRIVATE_KEY"
          done

          echo ""
          echo "=== Release artifacts ==="
          find artifacts -type f | sort

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          NOTES="## ConnLog Agent ${VERSION}

          ### Installation
          \`\`\`bash
          curl -fsSL https://connlog.com/install.sh | sudo sh -s -- --install --token <your-token>
          \`\`\`

          ### Supported platforms
          - Linux x86_64 (\`connlog-agent-${VERSION}-linux-x86_64\`)
          - Linux aarch64 (\`connlog-agent-${VERSION}-linux-aarch64\`)

          ### Auto-update
          Existing agents will automatically update to this version.
          All binaries are signed with Ed25519 and verified before installation.

          ### Verification
          SHA-256 checksums and Ed25519 signatures (.sig) are attached to every binary."

          if gh release view "$VERSION" &>/dev/null; then
            echo "Release $VERSION already exists, uploading assets..."
            for bin in artifacts/*/connlog-agent-${VERSION}-*; do
              [[ "$bin" == *.tar.gz ]] && continue
              [[ "$bin" == *.sha256 ]] && continue
              [[ "$bin" == *.sig ]] && continue
              echo "Uploading raw binary: $bin"
              gh release upload "$VERSION" "$bin" --clobber
            done
            gh release upload "$VERSION" \
              artifacts/**/*.tar.gz \
              artifacts/**/*.sha256 \
              artifacts/**/*.sig \
              --clobber
          else
            RAW_BINS=()
            for bin in artifacts/*/connlog-agent-${VERSION}-*; do
              [[ "$bin" == *.tar.gz ]] && continue
              [[ "$bin" == *.sha256 ]] && continue
              [[ "$bin" == *.sig ]] && continue
              RAW_BINS+=("$bin")
            done
            gh release create "$VERSION" \
              --title "ConnLog Agent ${VERSION}" \
              --notes "$NOTES" \
              --latest \
              "${RAW_BINS[@]}" \
              artifacts/**/*.tar.gz \
              artifacts/**/*.sha256 \
              artifacts/**/*.sig
          fi
