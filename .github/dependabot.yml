version: 2
updates:
  # Keep GitHub Actions pinned to SHA digests automatically.
  # Dependabot will open PRs when a new version of an action is released,
  # updating both the tag comment and the underlying SHA.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  # Keep Cargo dependencies up to date.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
