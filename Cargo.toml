[package]
name = "connlog-agent"
version = "1.23.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/connlog/agent"
homepage = "https://connlog.com"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
sysinfo = "0.32"
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
hostname = "0.4"
ring = "0.17"
# Integrations (Phase 10) pin a Proxmox node's self-signed certificate by its
# SHA-256 fingerprint, checked in the handshake so the API token is never
# sent to anything else. The same rustls, and the same ring provider, that
# reqwest already builds: nothing new is compiled in.
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
# SNMPv3 privacy (T10.3) is AES-128 in CFB mode (RFC 3826), which ring does
# not offer. The RustCrypto block cipher and mode: pure Rust, no runtime,
# no parser, a few tens of KB.
aes = "0.8"
cfb-mode = "0.8"
# Arrow-key menus for `connlog-agent` run by hand in a terminal
# (`features::menu`), and the hidden prompt for the BMC password
# (`features::settings`), which is never typed on a command line. Default
# features off but `password` (zeroize, a few KB): no editor (tempfile).
dialoguer = { version = "0.12", default-features = false, features = ["password"] }
# `connlog-agent completions bash|zsh|fish`, which install writes where each
# shell looks (owner, 2026-10-31): static scripts from the clap definition,
# no runtime of its own. With it the release binary is 6.8 MiB of the 12.
clap_complete = "4.6"

# Unix-only: geteuid() etc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Optimise the release binary for size (and to drop a few hundred KB of
# debug symbols + per-crate codegen units). Link time is noticeably slower
# under LTO; that is acceptable for release builds.
#
# `panic` stays at the default (unwind): metric collection wraps `sysinfo` in
# `catch_unwind` so a panic there costs one heartbeat of zeros, not the
# process. `panic = "abort"` would make that guard a no-op and turn every
# collector panic into a restart of the whole agent.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
