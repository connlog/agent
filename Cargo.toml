[package]
name = "connlog-agent"
version = "0.1.0"
edition = "2026"

[features]
default = []
dev-mode = ["rand"]

[dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.32"
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
hostname = "0.4"
libc = "0.2"

[dependencies.rand]
version = "0.8"
optional = true
