[package]
name = "connlog-agent"
version = "1.5.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/connlog/agent"
homepage = "https://connlog.com"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
sysinfo = "0.32"
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
hostname = "0.4"
ring = "0.17"

# Unix-only: geteuid() etc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Optimise the release binary for size (and to drop a few hundred KB of
# debug symbols + per-crate codegen units). Link time is noticeably slower
# under LTO; that is acceptable for release builds.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
