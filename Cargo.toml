[package]
name = "connlog-agent"
version = "0.3.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
sysinfo = "0.32"
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
hostname = "0.4"
libc = "0.2"
ring = "0.17"
