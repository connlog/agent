[package]
name = "connlog-agent"
version = "1.2.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
sysinfo = "0.32"
anyhow = "1.0"
env_logger = "0.11"
log = "0.4"
hostname = "0.4"
ring = "0.17"

# Unix-only: geteuid() etc.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Windows-only: SCM dispatcher + DPAPI + ACL + filesystem APIs.
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

# Optimise the release binary for size (and to drop a few hundred KB of
# debug symbols + per-crate codegen units). Link time is noticeably slower
# under LTO; that is acceptable for release builds.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
